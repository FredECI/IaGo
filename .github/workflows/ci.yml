# CI do IaGo: análise, testes, regras do Firestore e builds (web + APK).
# Roda em push para main e feat/**, em PR e manual.
# Secrets (FIREBASE_ENV_JSON, ANDROID_DEBUG_KEYSTORE) e APK so em main (if: github.ref == refs/heads/main, também no manual).
# Em feat/** e PR: analyze, testes, regras e build web em modo demo, sem secrets.
# NUNCA grave token de depuracao do App Check no secret.
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, testes e builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análise estática (sem avisos)
        run: flutter analyze

      - name: Testes unitários e de widget
        run: flutter test

      # Opcional: com o secret FIREBASE_ENV_JSON (conteúdo do env/firebase.json),
      # os builds já saem ligados ao Firebase. Sem ele, modo demonstração.
      - name: Configuração do Firebase (opcional)
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
        run: |
          if [ -n "$FIREBASE_ENV_JSON" ]; then
            printf '%s' "$FIREBASE_ENV_JSON" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > env/firebase.json
            echo "DEFINES=--dart-define-from-file=env/firebase.json" >> "$GITHUB_ENV"
          else
            echo "Sem FIREBASE_ENV_JSON: builds em modo demonstração."
          fi

      # Opcional: com o secret ANDROID_DEBUG_KEYSTORE (keystore em base64), todo
      # APK sai com a mesma assinatura, e a versão nova instala por cima da antiga.
      # Sem ele, cada execução gera uma chave nova. O `tr` deixa só o alfabeto do
      # base64: o pipe do PowerShell acrescenta BOM e \r\n ao gravar o secret.
      - name: Chave de assinatura estável (opcional)
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          else
            echo "Sem ANDROID_DEBUG_KEYSTORE: chave de debug nova nesta execução."
          fi

      # Fora de main, $DEFINES fica vazio: build em modo demonstração.
      - name: Build web (CanvasKit embutido, funciona sem CDN)
        run: flutter build web --release --no-web-resources-cdn $DEFINES

      # ARM de 32 e 64 bits cobre todos os celulares; x86_64 só serve a emulador.
      - name: Build APK de release (chave de debug)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --target-platform android-arm,android-arm64 $DEFINES

      - name: Assinatura do APK
        if: github.ref == 'refs/heads/main'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: iago-web
          path: build/web
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: iago-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g firebase-tools

      - run: npm ci
        working-directory: firestore-tests

      - name: Testes das regras (todos os firestore-tests/*.test.mjs)
        run: firebase emulators:exec --only firestore --project demo-iago "node --test firestore-tests/*.test.mjs"
