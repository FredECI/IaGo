# CI do IaGo: análise, testes, regras do Firestore e builds (web + APK).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, testes e builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análise estática (sem avisos)
        run: flutter analyze

      - name: Testes unitários e de widget
        run: flutter test

      # Opcional: com o secret FIREBASE_ENV_JSON (conteúdo do env/firebase.json),
      # os builds já saem ligados ao Firebase. Sem ele, modo demonstração.
      - name: Configuração do Firebase (opcional)
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
        run: |
          if [ -n "$FIREBASE_ENV_JSON" ]; then
            printf '%s' "$FIREBASE_ENV_JSON" > env/firebase.json
            echo "DEFINES=--dart-define-from-file=env/firebase.json" >> "$GITHUB_ENV"
          else
            echo "Sem FIREBASE_ENV_JSON: builds em modo demonstração."
          fi

      - name: Build web (CanvasKit embutido, funciona sem CDN)
        run: flutter build web --release --no-web-resources-cdn $DEFINES

      - name: Build APK de release (chave de debug)
        run: flutter build apk --release $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: iago-web
          path: build/web
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: iago-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g firebase-tools

      - run: npm ci
        working-directory: firestore-tests

      - name: Testes das regras
        run: firebase emulators:exec --only firestore --project demo-iago "node --test firestore-tests/rules.test.mjs"
